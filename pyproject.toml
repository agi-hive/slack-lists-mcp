[project]
name = "slack-lists-mcp"
dynamic = ["version"]
description = "MCP server for Slack Lists: items, subtasks and comments, with fields set by column name"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
authors = [{ name = "AGI Hive", email = "info@agihive.org" }]
keywords = ["mcp", "slack", "slack-lists", "claude"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Topic :: Communications :: Chat",
]
dependencies = [
  "mcp>=2,<3",
  "httpx>=0.27",
  "pydantic>=2.12",
]

[project.urls]
Repository = "https://github.com/agi-hive/slack-lists-mcp"
Changelog = "https://github.com/agi-hive/slack-lists-mcp/blob/main/CHANGELOG.md"

[project.scripts]
slack-lists-mcp = "server:main"

[dependency-groups]
dev = [
  "pytest>=8",
  "anyio>=4",
  "ruff>=0.8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.version]
path = "server.py"

[tool.hatch.build.targets.wheel]
only-include = ["server.py"]

[tool.hatch.build.targets.sdist]
include = ["server.py", "test_connection.py", "README.md", "CHANGELOG.md", "LICENSE", "pyproject.toml"]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "B", "UP", "I", "SIM", "RUF"]
ignore = [
  "RUF001", "RUF002", "RUF003",  # the docs use typographic dashes/ellipses on purpose
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
